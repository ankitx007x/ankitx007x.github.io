<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher — Fragments & Echoes</title>

    <style>
        :root {
            --bg-color: #08080b;
            --text-primary: #e4e4ed;
            --text-secondary: #5a5a6e;
            --accent: #a385b9;
            --accent-dim: rgba(163, 133, 185, 0.15);
            --nav-bg: rgba(8, 8, 11, 0.9);
            --border: #161622;
            --card-bg: rgba(18, 18, 26, 0.4);
            --success: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 2.5rem;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
        }

        .nav-logo {
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
            text-decoration: none;
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-dim);
        }

        main {
            width: 100%;
            max-width: 680px;
            padding-top: 110px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
        }

        .page-sublogo {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .daily-meta {
            text-align: right;
            font-family: monospace;
            font-size: 0.7rem;
            line-height: 1.6;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            gap: 1rem;
        }

        .game-title {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .clue-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .clue-nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .clue-nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .clue-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .clue-counter {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-width: 110px;
            text-align: center;
        }

        .clue-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 4px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: border-color 0.3s ease;
        }

        .clue-card:hover {
            border-color: rgba(163, 133, 185, 0.4);
        }

        .clue-type-badge {
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
        }

        .clue-text {
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #f0f0f5;
            text-align: center;
        }

        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .game-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-family: Georgia, serif;
            font-size: 1rem;
            font-style: italic;
            color: var(--text-primary);
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .game-input:focus {
            border-color: var(--accent);
        }

        .game-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-message {
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--error-red);
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-message.visible {
            opacity: 1;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .dropdown-list.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background: var(--card-bg);
            outline: none;
        }

        .dropdown-item.status-msg {
            cursor: default;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            justify-content: center;
            padding: 1rem;
        }

        .dropdown-poster {
            width: 32px;
            height: 48px;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
            background-color: #161622;
            flex-shrink: 0;
        }

        .dropdown-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dropdown-title {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dropdown-meta {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-skip {
            align-self: flex-start;
            border: none;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 1px;
            cursor: pointer;
            background: transparent;
            transition: color 0.2s ease;
        }

        .btn-skip:hover {
            color: var(--accent);
        }

        .status-display {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 6px;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .status-display.active {
            display: flex;
        }

        .status-header-badge {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 50px;
        }

        .status-header-badge.win {
            color: var(--success);
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
        }

        .status-header-badge.fail {
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--border);
        }

        .film-card-summary {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(8,8,11,0.6);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 4px;
            width: 100%;
            text-align: left;
        }

        .film-poster-container {
            width: 85px;
            height: 128px;
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: #12121a;
            overflow: hidden;
        }

        .film-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .film-meta-details {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .film-title-text {
            font-size: 1.35rem;
            font-style: italic;
        }

        .film-subtext {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .solve-stats {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 0.2rem;
        }

        .media-frame-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .media-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            font-family: monospace;
            color: var(--text-secondary);
            text-align: center;
            padding: 1rem;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(110,110,128,0.3);
            letter-spacing: 1.5px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }

            nav {
                padding: 1.5rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1.2rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            main { padding-top: 155px; }

            .page-header,
            .game-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .daily-meta {
                text-align: left;
            }

            .film-card-summary {
                flex-direction: column;
                text-align: center;
            }

            .film-meta-details {
                align-items: center;
            }
        }
    </style>
</head>

    <script>
        "use strict";

        /*
         * CIPHER DAILY FILM DATABASE
         *
         * The database contains 100 films. The day determines which film is
         * active, using Europe/London as the authoritative calendar.
         *
         * After film #100, the database cycles back to #1.
         *
         * TMDB is used to fetch:
         * - poster
         * - release year
         * - director
         * - lead actor
         * - trailer
         *
         * TMDB supports movie details with append_to_response, allowing
         * details/credits/videos to be fetched together.
         */

        const TMDB_API_KEY = "a2423ea9535bda58e2447a6a29d92cb6";

        const UK_TIME_ZONE = "Europe/London";
        const DATABASE_START_DATE = "2026-08-19";
        const MAX_ATTEMPTS = 5;

        const FILM_DATABASE = [
            "Mulholland Drive",
            "The Seventh Seal",
            "Seven Samurai",

            "Tokyo Story",
            "Ikiru",
            "Rashomon",
            "Yojimbo",
            "Harakiri",
            "Ran",
            "The Wages of Fear",
            "The 400 Blows",
            "Breathless",
            "La Haine",
            "Amélie",
            "Portrait of a Lady on Fire",
            "The Lives of Others",
            "Wings of Desire",
            "Cinema Paradiso",
            "8½",
            "La Dolce Vita",
            "Bicycle Thieves",
            "The Battle of Algiers",
            "Lawrence of Arabia",
            "Chinatown",
            "Rear Window",
            "Vertigo",
            "Psycho",
            "North by Northwest",
            "Sunset Boulevard",
            "Citizen Kane",
            "Casablanca",
            "The Third Man",
            "12 Angry Men",
            "One Flew Over the Cuckoo's Nest",
            "Eternal Sunshine of the Spotless Mind",
            "Her",
            "The Truman Show",
            "Being John Malkovich",
            "The Prestige",
            "Memento",
            "Inception",
            "Interstellar",
            "The Grand Budapest Hotel",
            "Fantastic Mr. Fox",
            "The Royal Tenenbaums",
            "Eraserhead",
            "Blue Velvet",
            "Lost Highway",
            "The Elephant Man",
            "Fargo",
            "Inside Llewyn Davis",
            "Burn After Reading",
            "A Serious Man",
            "The Big Lebowski",
            "Before Sunrise",
            "Before Sunset",
            "Before Midnight",
            "The Worst Person in the World"
        ];

        const els = {
            dailyNumber: document.getElementById("dailyNumber"),
            nextReset: document.getElementById("nextReset"),
            clueCounter: document.getElementById("clueCounter"),
            clueTypeBadge: document.getElementById("clueTypeBadge"),
            clueText: document.getElementById("clueText"),
            clueCard: document.getElementById("clueCard"),
            prevClueBtn: document.getElementById("prevClueBtn"),
            nextClueBtn: document.getElementById("nextClueBtn"),
            gameControls: document.getElementById("gameControls"),
            gameInput: document.getElementById("gameInput"),
            dropdownList: document.getElementById("dropdownList"),
            feedbackMessage: document.getElementById("feedbackMessage"),
            skipBtn: document.getElementById("skipBtn"),
            statusDisplay: document.getElementById("statusDisplay"),
            statusBadge: document.getElementById("statusBadge"),
            filmPosterImg: document.getElementById("filmPosterImg"),
            filmTitleText: document.getElementById("filmTitleText"),
            filmDirectorText: document.getElementById("filmDirectorText"),
            solveStatsText: document.getElementById("solveStatsText"),
            mediaIframe: document.getElementById("mediaIframe")
        };

        let currentFilm = null;
        let hintsList = [];
        let attemptsUsed = 0;
        let unlockedClueIndex = 0;
        let viewedClueIndex = 0;
        let isGameOver = false;
        let debounceTimer = null;
        let searchRequestId = 0;
        let resetTimer = null;

        function getUKDateParts(date = new Date()) {
            const parts = new Intl.DateTimeFormat("en-CA", {
                timeZone: UK_TIME_ZONE,
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }).formatToParts(date);

            const result = {};

            for (const part of parts) {
                if (part.type !== "literal") {
                    result[part.type] = part.value;
                }
            }

            return {
                year: Number(result.year),
                month: Number(result.month),
                day: Number(result.day)
            };
        }

        function getUKDateKey(date = new Date()) {
            const { year, month, day } = getUKDateParts(date);

            return [
                year,
                String(month).padStart(2, "0"),
                String(day).padStart(2, "0")
            ].join("-");
        }

        function parseUTCDate(dateString) {
            const [year, month, day] = dateString.split("-").map(Number);
            return Date.UTC(year, month - 1, day);
        }

        function getDailyIndex(dateKey) {
            const start = parseUTCDate(DATABASE_START_DATE);
            const current = parseUTCDate(dateKey);
            const elapsedDays = Math.floor((current - start) / 86400000);

            // Positive modulo so the database cycles forever.
            return ((elapsedDays % FILM_DATABASE.length) +
                FILM_DATABASE.length) % FILM_DATABASE.length;
        }

        function getDailyNumber(dateKey) {
            const start = parseUTCDate(DATABASE_START_DATE);
            const current = parseUTCDate(dateKey);
            const elapsedDays = Math.floor((current - start) / 86400000);

            return elapsedDays + 1;
        }

        function getCurrentDailyFilm() {
            const dateKey = getUKDateKey();
            const index = getDailyIndex(dateKey);

            return {
                dateKey,
                index,
                dailyNumber: getDailyNumber(dateKey),
                title: FILM_DATABASE[index]
            };
        }

        function getNextUKMidnight() {
            const now = new Date();
            const currentKey = getUKDateKey(now);
            const currentParts = getUKDateParts(now);

            /*
             * Find the next instant whose London-local calendar date is
             * different from the current one. This handles GMT/BST correctly
             * instead of assuming London is always UTC+0.
             */
            let candidate = new Date(now.getTime() + 60000);

            for (let i = 0; i < 36; i++) {
                if (getUKDateKey(candidate) !== currentKey) {
                    // Binary search the transition to midnight.
                    let low = new Date(candidate.getTime() - 120000);
                    let high = candidate;

                    for (let j = 0; j < 35; j++) {
                        const middle = new Date(
                            (low.getTime() + high.getTime()) / 2
                        );

                        if (getUKDateKey(middle) === currentKey) {
                            low = middle;
                        } else {
                            high = middle;
                        }
                    }

                    return high;
                }

                candidate = new Date(candidate.getTime() + 60 * 60 * 1000);
            }

            // Extremely defensive fallback.
            return new Date(now.getTime() + 24 * 60 * 60 * 1000);
        }

        function updateCountdown() {
            const next = getNextUKMidnight();
            const remaining = Math.max(0, next.getTime() - Date.now());

            const totalSeconds = Math.floor(remaining / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            els.nextReset.textContent =
                `NEXT FILM — ${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }

        function saveDailyState() {
            if (!currentFilm) return;

            const key = `cipher-${currentFilm.dateKey}`;

            localStorage.setItem(key, JSON.stringify({
                attemptsUsed,
                unlockedClueIndex,
                viewedClueIndex,
                isGameOver
            }));
        }

        function loadDailyState() {
            if (!currentFilm) return null;

            try {
                const raw = localStorage.getItem(`cipher-${currentFilm.dateKey}`);
                return raw ? JSON.parse(raw) : null;
            } catch {
                return null;
            }
        }

        function updateClueDisplay() {
            const clue = hintsList[viewedClueIndex];

            if (!clue) return;

            els.clueCounter.textContent =
                `HINT ${viewedClueIndex + 1} / ${hintsList.length}`;

            els.clueTypeBadge.textContent = clue.type;
            els.clueText.textContent = clue.text;

            els.prevClueBtn.disabled = viewedClueIndex === 0;
            els.nextClueBtn.disabled =
                viewedClueIndex >= unlockedClueIndex;
        }

        function advanceClue() {
            if (unlockedClueIndex >= hintsList.length - 1) {
                return;
            }

            unlockedClueIndex++;
            viewedClueIndex = unlockedClueIndex;

            updateClueDisplay();
            saveDailyState();
        }

        function showFeedback(message) {
            els.feedbackMessage.textContent = message;
            els.feedbackMessage.classList.add("visible");
        }

        function hideFeedback() {
            els.feedbackMessage.textContent = "";
            els.feedbackMessage.classList.remove("visible");
        }

        function clearDropdown() {
            els.dropdownList.replaceChildren();
            els.dropdownList.classList.remove("active");
        }

        function showDropdownMessage(message) {
            els.dropdownList.replaceChildren();

            const item = document.createElement("div");
            item.className = "dropdown-item status-msg";
            item.textContent = message;

            els.dropdownList.appendChild(item);
            els.dropdownList.classList.add("active");
        }

        async function tmdbRequest(path, params = {}) {
            const query = new URLSearchParams({
                ...params,
                api_key: TMDB_API_KEY,
                language: "en-US"
            });

            const response = await fetch(
                `https://api.themoviedb.org/3${path}?${query.toString()}`,
                {
                    headers: {
                        Accept: "application/json"
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`TMDB request failed (${response.status})`);
            }

            return response.json();
        }

        async function resolveFilm(title) {
            const searchData = await tmdbRequest("/search/movie", {
                query: title,
                include_adult: "false"
            });

            const results = Array.isArray(searchData.results)
                ? searchData.results
                : [];

            if (!results.length) {
                throw new Error(`Could not find "${title}" on TMDB.`);
            }

            /*
             * Exact title matches are preferred. This prevents similarly named
             * films from being selected by the search endpoint.
             */
            const normalizedTarget = normalizeStr(title);

            const exact = results.find(movie =>
                normalizeStr(movie.title) === normalizedTarget
            );

            const match = exact || results[0];

            return tmdbRequest(`/movie/${match.id}`, {
                append_to_response: "credits,videos",
                include_video_language: "en,null"
            });
        }

        function chooseDirector(credits) {
            return credits?.crew?.find(person =>
                person.job === "Director"
            )?.name || "Unknown Director";
        }

        function chooseLeadActor(credits) {
            const cast = Array.isArray(credits?.cast)
                ? credits.cast
                : [];

            return cast[0]?.name || "Unknown";
        }

        function chooseTrailer(videos) {
            const results = Array.isArray(videos?.results)
                ? videos.results
                : [];

            const preferred = results
                .filter(video =>
                    video.site === "YouTube" &&
                    video.key &&
                    ["Trailer", "Teaser"].includes(video.type)
                )
                .sort((a, b) => {
                    const aOfficial = a.official ? 1 : 0;
                    const bOfficial = b.official ? 1 : 0;

                    if (aOfficial !== bOfficial) {
                        return bOfficial - aOfficial;
                    }

                    const aTrailer = a.type === "Trailer" ? 1 : 0;
                    const bTrailer = b.type === "Trailer" ? 1 : 0;

                    return bTrailer - aTrailer;
                });

            return preferred[0]?.key || null;
        }

        function buildHints(movie) {
            const director = chooseDirector(movie.credits);
            const leadActor = chooseLeadActor(movie.credits);

            const year = movie.release_date
                ? movie.release_date.substring(0, 4)
                : "Unknown";

            /*
             * We deliberately don't expose the title in the clues.
             * The first clue is generated from the film's overview rather
             * than inventing a quotation and falsely presenting it as one.
             */
            const overview = movie.overview?.trim();

            const openingClue = overview
                ? `A film described as: "${overview}"`
                : "The first fragment offers no easy answer.";

            return [
                {
                    type: "Initial Fragment",
                    text: openingClue
                },
                {
                    type: "Hint 1 (Lead Actor)",
                    text: `Lead actor: ${leadActor}`
                },
                {
                    type: "Hint 2 (Release Year)",
                    text: `Release year: ${year}`
                },
                {
                    type: "Hint 3 (Director)",
                    text: `Director: ${director}`
                },
                {
                    type: "Hint 4 (Genre)",
                    text: `Genre: ${
                        Array.isArray(movie.genres) && movie.genres.length
                            ? movie.genres.map(g => g.name).join(" / ")
                            : "Unknown"
                    }`
                }
            ];
        }

        function renderSearchResult(movie) {
            const item = document.createElement("div");
            item.className = "dropdown-item";
            item.setAttribute("role", "option");
            item.tabIndex = 0;

            const poster = document.createElement("div");
            poster.className = "dropdown-poster";

            if (movie.poster_path) {
                poster.style.backgroundImage =
                    `url("https://image.tmdb.org/t/p/w92${movie.poster_path}")`;
            }

            const info = document.createElement("div");
            info.className = "dropdown-info";

            const title = document.createElement("span");
            title.className = "dropdown-title";
            title.textContent = movie.title || "Untitled";

            const meta = document.createElement("span");
            meta.className = "dropdown-meta";
            meta.textContent = movie.release_date
                ? movie.release_date.substring(0, 4)
                : "N/A";

            info.append(title, meta);
            item.append(poster, info);

            const select = () => {
                clearDropdown();
                submitGuess(movie.title || "");
            };

            item.addEventListener("click", select);

            item.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    select();
                }
            });

            return item;
        }

        function renderDropdown(movies) {
            els.dropdownList.replaceChildren();

            movies.slice(0, 5).forEach(movie => {
                els.dropdownList.appendChild(renderSearchResult(movie));
            });

            els.dropdownList.classList.add("active");
        }

        function handleInput() {
            clearTimeout(debounceTimer);

            const query = els.gameInput.value.trim();
            const requestId = ++searchRequestId;

            hideFeedback();

            if (isGameOver || query.length < 2) {
                clearDropdown();
                return;
            }

            showDropdownMessage("Searching cinema database...");

            debounceTimer = setTimeout(async () => {
                try {
                    const data = await tmdbRequest("/search/movie", {
                        query,
                        include_adult: "false"
                    });

                    if (requestId !== searchRequestId || isGameOver) {
                        return;
                    }

                    const movies = Array.isArray(data.results)
                        ? data.results
                        : [];

                    if (!movies.length) {
                        showDropdownMessage("No matching films found.");
                        return;
                    }

                    renderDropdown(movies);
                } catch (error) {
                    if (requestId !== searchRequestId) return;

                    console.error(error);
                    showDropdownMessage(
                        "Could not reach the cinema database."
                    );
                }
            }, 300);
        }

        function normalizeStr(value) {
            return String(value)
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
        }

        function submitGuess(title) {
            if (isGameOver || !currentFilm || !title) {
                return;
            }

            attemptsUsed++;
            els.gameInput.value = "";
            clearDropdown();

            const correct =
                normalizeStr(title) === normalizeStr(currentFilm.title);

            if (correct) {
                endGame(true);
                return;
            }

            if (attemptsUsed >= MAX_ATTEMPTS) {
                endGame(false);
                return;
            }

            showFeedback(
                `"${title}" is incorrect. ` +
                `Try ${attemptsUsed}/${MAX_ATTEMPTS} used.`
            );

            advanceClue();
            saveDailyState();
        }

        function handleSkip() {
            if (isGameOver) return;

            attemptsUsed++;
            els.gameInput.value = "";
            clearDropdown();
            hideFeedback();

            if (attemptsUsed >= MAX_ATTEMPTS) {
                endGame(false);
                return;
            }

            advanceClue();
            saveDailyState();
        }

        function loadPoster(movie) {
            if (!movie?.poster_path) {
                els.filmPosterImg.removeAttribute("src");
                els.filmPosterImg.alt = "Poster unavailable";
                return;
            }

            els.filmPosterImg.src =
                `https://image.tmdb.org/t/p/w500${movie.poster_path}`;

            els.filmPosterImg.alt =
                `${currentFilm.title} poster`;
        }

        function loadTrailer(movie) {
            els.mediaIframe.removeAttribute("src");

            const videoId = chooseTrailer(movie.videos);

            if (!videoId) {
                console.warn("No embeddable YouTube trailer found.");
                return;
            }

            /*
             * Muted autoplay is used because browsers commonly block
             * autoplay when a video has sound.
             */
            const params = new URLSearchParams({
                autoplay: "1",
                mute: "1",
                playsinline: "1",
                rel: "0"
            });

            els.mediaIframe.src =
                `https://www.youtube-nocookie.com/embed/${videoId}?${params.toString()}`;
        }

        function endGame(won) {
            if (isGameOver) return;

            isGameOver = true;
            clearTimeout(debounceTimer);
            searchRequestId++;

            clearDropdown();

            els.gameControls.style.display = "none";

            unlockedClueIndex = hintsList.length - 1;
            updateClueDisplay();

            els.statusDisplay.classList.add("active");

            els.filmTitleText.textContent = currentFilm.title;

            const director = chooseDirector(currentFilm.credits);
            const year = currentFilm.release_date
                ? currentFilm.release_date.substring(0, 4)
                : "Unknown";

            els.filmDirectorText.textContent =
                `${year} • Dir. ${director}`;

            loadPoster(currentFilm);
            loadTrailer(currentFilm);

            if (won) {
                els.statusBadge.className = "status-header-badge win";
                els.statusBadge.textContent = "ENTRY VERIFIED";

                els.solveStatsText.textContent =
                    `Solved in ${attemptsUsed} ` +
                    `${attemptsUsed === 1 ? "guess" : "guesses"}!`;
            } else {
                els.statusBadge.className = "status-header-badge fail";
                els.statusBadge.textContent = "ENTRY UNRESOLVED";

                els.solveStatsText.textContent =
                    `Out of guesses (${attemptsUsed}/${MAX_ATTEMPTS} used).`;
            }

            saveDailyState();
        }

        function restoreCompletedState(state) {
            if (!state?.isGameOver) {
                return false;
            }

            attemptsUsed = state.attemptsUsed || MAX_ATTEMPTS;
            unlockedClueIndex = hintsList.length - 1;
            viewedClueIndex = hintsList.length - 1;
            isGameOver = true;

            els.gameControls.style.display = "none";
            els.statusDisplay.classList.add("active");

            els.filmTitleText.textContent = currentFilm.title;

            const director = chooseDirector(currentFilm.credits);
            const year = currentFilm.release_date
                ? currentFilm.release_date.substring(0, 4)
                : "Unknown";

            els.filmDirectorText.textContent =
                `${year} • Dir. ${director}`;

            /*
             * We don't store whether the previous result was a win in the
             * state above, so infer it from attempts only if desired. For
             * this version, a completed day is shown as solved/finished.
             */
            els.statusBadge.className = "status-header-badge win";
            els.statusBadge.textContent = "ENTRY COMPLETED";

            els.solveStatsText.textContent =
                `Daily cipher completed in ${attemptsUsed} ` +
                `${attemptsUsed === 1 ? "guess" : "guesses"}.`;

            loadPoster(currentFilm);
            loadTrailer(currentFilm);
            updateClueDisplay();

            return true;
        }

        async function startDailyCipher() {
            const daily = getCurrentDailyFilm();

            currentFilm = {
                ...daily
            };

            els.dailyNumber.textContent =
                `DAILY CIPHER #${String(daily.dailyNumber).padStart(3, "0")}`;

            els.clueText.textContent =
                `Loading today's film: ${daily.title}...`;

            els.gameInput.disabled = true;
            els.skipBtn.disabled = true;

            try {
                const movie = await resolveFilm(daily.title);

                currentFilm = {
                    ...daily,
                    ...movie
                };

                hintsList = buildHints(movie);

                attemptsUsed = 0;
                unlockedClueIndex = 0;
                viewedClueIndex = 0;
                isGameOver = false;

                els.statusDisplay.classList.remove("active");
                els.gameControls.style.display = "flex";

                els.gameInput.disabled = false;
                els.skipBtn.disabled = false;

                updateClueDisplay();

                const state = loadDailyState();

                if (state) {
                    attemptsUsed = Number(state.attemptsUsed) || 0;
                    unlockedClueIndex = Math.min(
                        Number(state.unlockedClueIndex) || 0,
                        hintsList.length - 1
                    );
                    viewedClueIndex = Math.min(
                        Number(state.viewedClueIndex) || 0,
                        unlockedClueIndex
                    );

                    if (restoreCompletedState(state)) {
                        return;
                    }

                    updateClueDisplay();
                }
            } catch (error) {
                console.error("Could not initialize daily cipher:", error);

                els.clueTypeBadge.textContent = "DATABASE ERROR";
                els.clueText.textContent =
                    "Today's film could not be loaded. Please refresh.";

                els.gameInput.disabled = true;
                els.skipBtn.disabled = true;
            }
        }

        async function checkForNewDay() {
            const activeDate = getUKDateKey();

            if (currentFilm && currentFilm.dateKey !== activeDate) {
                /*
                 * The page stayed open across UK midnight.
                 * Completely reinitialize the game for the new film.
                 */
                clearTimeout(resetTimer);

                attemptsUsed = 0;
                unlockedClueIndex = 0;
                viewedClueIndex = 0;
                isGameOver = false;

                els.statusDisplay.classList.remove("active");
                els.gameControls.style.display = "flex";
                els.gameInput.value = "";
                els.gameInput.disabled = true;
                els.skipBtn.disabled = true;

                await startDailyCipher();
            }

            updateCountdown();
        }

        function scheduleMidnightCheck() {
            clearTimeout(resetTimer);

            const nextMidnight = getNextUKMidnight();
            const delay = Math.max(
                1000,
                nextMidnight.getTime() - Date.now() + 1000
            );

            resetTimer = setTimeout(async () => {
                await checkForNewDay();
                scheduleMidnightCheck();
            }, delay);
        }

        els.prevClueBtn.addEventListener("click", () => {
            if (viewedClueIndex > 0) {
                viewedClueIndex--;
                updateClueDisplay();
                saveDailyState();
            }
        });

        els.nextClueBtn.addEventListener("click", () => {
            if (viewedClueIndex < unlockedClueIndex) {
                viewedClueIndex++;
                updateClueDisplay();
                saveDailyState();
            }
        });

        els.gameInput.addEventListener("input", handleInput);

        els.gameInput.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                clearDropdown();
                return;
            }

            if (event.key === "Enter") {
                event.preventDefault();

                const firstResult =
                    els.dropdownList.querySelector(
                        ".dropdown-item:not(.status-msg)"
                    );

                if (firstResult) {
                    firstResult.click();
                }
            }
        });

        els.skipBtn.addEventListener("click", handleSkip);

        document.addEventListener("click", event => {
            if (!event.target.closest(".search-input-wrapper")) {
                clearDropdown();
            }
        });

        /*
         * If the user leaves the tab open overnight, visibility changes are
         * also checked so the new cipher appears immediately when they return.
         */
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                checkForNewDay();
            }
        });

        // Countdown updates once per second.
        setInterval(updateCountdown, 1000);

        // Start today's cipher.
        startDailyCipher();
        scheduleMidnightCheck();
        updateCountdown();
    </script>
</body>
</html>
