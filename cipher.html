<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher — Fragments & Echoes</title>
    <style>
        :root {
            --bg-color: #08080b;
            --text-primary: #e4e4ed;
            --text-secondary: #5a5a6e;
            --accent: #a385b9;
            --accent-dim: rgba(163, 133, 185, 0.15);
            --nav-bg: rgba(8, 8, 11, 0.9);
            --border: #161622;
            --card-bg: rgba(18, 18, 26, 0.4);
            --success: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 2.5rem;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
        }

        .nav-logo {
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
            text-decoration: none;
            opacity: 0.8;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-dim);
        }

        /* Main Game Layout */
        main {
            width: 100%;
            max-width: 680px; 
            padding-top: 110px; 
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Prominent Header Below Nav Bar */
        .page-header {
            margin-bottom: 0.25rem;
        }

        .page-sublogo {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.95;
            display: inline-block;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .game-title {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* Clue Controls */
        .clue-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .clue-nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .clue-nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .clue-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .clue-counter {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-width: 110px;
            text-align: center;
        }

        /* Clue Card Area */
        .clue-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 4px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .clue-card:hover {
            border-color: rgba(163, 133, 185, 0.4);
        }

        .clue-type-badge {
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
        }

        .clue-text {
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #f0f0f5;
            text-align: center;
        }

        /* Controls & Search */
        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .game-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            font-style: italic;
            color: var(--text-primary);
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .game-input:focus {
            border-color: var(--accent);
        }

        /* Red Error Message Area */
        .feedback-message {
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--error-red);
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: -0.25rem;
        }

        .feedback-message.visible {
            opacity: 1;
        }

        /* Dropdown Autocomplete */
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .dropdown-list.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }

        .dropdown-item:hover {
            background: var(--card-bg);
        }

        .dropdown-item.status-msg {
            cursor: default;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            justify-content: center;
            padding: 1rem;
        }

        .dropdown-poster {
            width: 32px;
            height: 48px;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
            background-color: #161622;
            flex-shrink: 0;
        }

        .dropdown-info {
            display: flex;
            flex-direction: column;
        }

        .dropdown-title {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-primary);
        }

        .dropdown-meta {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-skip {
            align-self: flex-start;
            border: none;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 1px;
            cursor: pointer;
            background: transparent;
            transition: color 0.2s ease;
            margin-top: 0.25rem;
        }

        .btn-skip:hover {
            color: var(--accent);
        }

        /* End Game Status Display */
        .status-display {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 6px;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .status-display.active {
            display: flex;
        }

        .status-header-badge {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            display: inline-block;
        }

        .status-header-badge.win { 
            color: var(--success); 
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-header-badge.fail { 
            color: var(--accent); 
            background: var(--accent-dim);
            border: 1px solid var(--border);
        }

        .film-card-summary {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(8, 8, 11, 0.6);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 4px;
            width: 100%;
            text-align: left;
        }

        /* Fixed Image Frame for Poster */
        .film-poster-container {
            width: 85px;
            height: 128px;
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background-color: #12121a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .film-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .film-meta-details {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .film-title-text {
            font-size: 1.35rem;
            font-style: italic;
            color: var(--text-primary);
        }

        .film-subtext {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .solve-stats {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 0.2rem;
        }

        .media-frame-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .media-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(110, 110, 128, 0.3);
            letter-spacing: 1.5px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 600px) {
            nav { padding: 1.5rem; flex-direction: column; gap: 1rem; }
            .nav-links { gap: 1.2rem; }
            main { padding-top: 150px; }
            .film-card-summary { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">// f&e</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="quotes">Quotes</a></li>
            <li><a href="poems">Poems</a></li>
            <li><a href="cinema">Cinema</a></li>
            <li><a href="cipher" class="active">Cipher</a></li>
        </ul>
    </nav>

    <main>
        <div class="page-header">
            <span class="page-sublogo">// CIPHER</span>
        </div>

        <div class="game-header">
            <span class="game-title">Guess The Film</span>
            <div class="clue-nav-wrapper">
                <button class="clue-nav-btn" id="prevClueBtn" title="Previous Clue">&lt;</button>
                <span class="clue-counter" id="clueCounter">HINT 1 / 5</span>
                <button class="clue-nav-btn" id="nextClueBtn" title="Next Unlocked Clue">&gt;</button>
            </div>
        </div>

        <div class="clue-card">
            <span class="clue-type-badge" id="clueTypeBadge">Initial Quote</span>
            <div class="clue-text" id="clueText">Loading quote...</div>
        </div>

        <div class="game-controls" id="gameControls">
            <div class="search-input-wrapper">
                <input type="text" id="gameInput" class="game-input" placeholder="Type film title to guess..." autocomplete="off">
                <div class="dropdown-list" id="dropdownList"></div>
            </div>
            <div class="feedback-message" id="feedbackMessage"></div>
            <button class="btn-skip" id="skipBtn">SKIP & UNLOCK HINT (+1 TRY)</button>
        </div>

        <div class="status-display" id="statusDisplay">
            <div class="status-header-badge" id="statusBadge">ENTRY VERIFIED</div>
            
            <div class="film-card-summary">
                <div class="film-poster-container">
                    <img class="film-poster-img" id="filmPosterImg" src="" alt="Film Poster">
                </div>
                <div class="film-meta-details">
                    <div class="film-title-text" id="filmTitleText">Mulholland Drive</div>
                    <div class="film-subtext" id="filmDirectorText">2001 &bull; Dir. David Lynch</div>
                    <div class="solve-stats" id="solveStatsText">Solved on Guess 1 of 5</div>
                </div>
            </div>

            <div class="media-frame-wrapper" id="mediaWrapper">
                <iframe class="media-iframe" id="mediaIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <footer>
        [ fragments & echoes // daily cipher ]
    </footer>

    <script>
        const TMDB_API_KEY = "a2423ea9535bda58e2447a6a29d92cb6";

        // Target Film & Clues
        const targetMovie = { 
            tmdbId: 490, // Explicit Mulholland Drive TMDB ID
            title: "Mulholland Drive", 
            year: "2001", 
            director: "David Lynch",
            leadActor: "Naomi Watts",
            keyActorMovie: "The Ring (2002) & King Kong (2005)",
            posterPath: "/oT182e0jvhZ6hNn9G4eE1E6gE2v.jpg", // Verified TMDB Poster Path
            youtubeKey: "pv4S3iI7N6A"
        };

        const hintsList = [
            { type: "Quote", text: "\"I opened my eyes and I was completely lost. Nothing makes sense, but every single scene is hypnotizing.\"" },
            { type: "Hint 1 (Key Actor Movie)", text: `Key actor starred in: ${targetMovie.keyActorMovie}` },
            { type: "Hint 2 (Lead Actor)", text: `Lead Actor: ${targetMovie.leadActor}` },
            { type: "Hint 3 (Release Year)", text: `Release Year: ${targetMovie.year}` },
            { type: "Hint 4 (Director)", text: `Director: ${targetMovie.director}` }
        ];

        let attemptsUsed = 0;
        let unlockedClueIndex = 0;
        let viewedClueIndex = 0;
        let isGameOver = false;
        let debounceTimer = null;

        const clueCounter = document.getElementById('clueCounter');
        const clueTypeBadge = document.getElementById('clueTypeBadge');
        const clueText = document.getElementById('clueText');
        const prevClueBtn = document.getElementById('prevClueBtn');
        const nextClueBtn = document.getElementById('nextClueBtn');
        const gameInput = document.getElementById('gameInput');
        const dropdownList = document.getElementById('dropdownList');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const skipBtn = document.getElementById('skipBtn');
        const statusDisplay = document.getElementById('statusDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const filmPosterImg = document.getElementById('filmPosterImg');
        const filmTitleText = document.getElementById('filmTitleText');
        const filmDirectorText = document.getElementById('filmDirectorText');
        const solveStatsText = document.getElementById('solveStatsText');
        const mediaIframe = document.getElementById('mediaIframe');

        function updateClueDisplay() {
            const currentClue = hintsList[viewedClueIndex];
            clueCounter.textContent = `HINT ${viewedClueIndex + 1} / ${hintsList.length}`;
            clueTypeBadge.textContent = currentClue.type;
            clueText.textContent = currentClue.text;

            prevClueBtn.disabled = viewedClueIndex === 0;
            nextClueBtn.disabled = viewedClueIndex >= unlockedClueIndex;
        }

        async function fetchTMDBMovies(query) {
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                const data = await res.json();
                return data.results || [];
            } catch (err) {
                console.error("TMDB API fetch error:", err);
                return null;
            }
        }

        function handleInput() {
            clearTimeout(debounceTimer);
            const query = gameInput.value.trim();
            if (!query || query.length < 2) {
                dropdownList.classList.remove('active');
                return;
            }

            dropdownList.innerHTML = `<div class="dropdown-item status-msg">Searching cinema database...</div>`;
            dropdownList.classList.add('active');

            debounceTimer = setTimeout(async () => {
                const movies = await fetchTMDBMovies(query);
                if (movies === null) {
                    dropdownList.innerHTML = `<div class="dropdown-item status-msg">Error fetching movies.</div>`;
                } else if (movies.length === 0) {
                    dropdownList.innerHTML = `<div class="dropdown-item status-msg">No matching films found.</div>`;
                } else {
                    renderDropdown(movies.slice(0, 5));
                }
            }, 300);
        }

        function renderDropdown(movies) {
            dropdownList.innerHTML = '';
            movies.forEach(movie => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w92${movie.poster_path}` : '';
                const releaseYear = movie.release_date ? movie.release_date.substring(0, 4) : 'N/A';

                item.innerHTML = `
                    <div class="dropdown-poster" style="${posterUrl ? `background-image: url('${posterUrl}')` : ''}"></div>
                    <div class="dropdown-info">
                        <span class="dropdown-title">${movie.title}</span>
                        <span class="dropdown-meta">${releaseYear}</span>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    dropdownList.classList.remove('active');
                    submitGuess(movie.title);
                });
                dropdownList.appendChild(item);
            });
            dropdownList.classList.add('active');
        }

        function normalizeStr(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function submitGuess(selectedTitle) {
            if (isGameOver) return;
            attemptsUsed++;

            if (normalizeStr(selectedTitle) === normalizeStr(targetMovie.title)) {
                hideFeedback();
                endGame(true);
            } else {
                gameInput.value = '';
                if (attemptsUsed >= 5) {
                    endGame(false);
                } else {
                    showFeedback(`"${selectedTitle}" is incorrect. Try ${attemptsUsed}/5 used.`);
                    advanceClue();
                }
            }
        }

        function showFeedback(msg) {
            feedbackMessage.textContent = msg;
            feedbackMessage.classList.add('visible');
        }

        function hideFeedback() {
            feedbackMessage.textContent = '';
            feedbackMessage.classList.remove('visible');
        }

        function handleSkip() {
            if (isGameOver) return;
            attemptsUsed++;
            gameInput.value = '';
            hideFeedback();

            if (attemptsUsed >= 5) {
                endGame(false);
            } else {
                advanceClue();
            }
        }

        function advanceClue() {
            if (unlockedClueIndex < hintsList.length - 1) {
                unlockedClueIndex++;
                viewedClueIndex = unlockedClueIndex;
                updateClueDisplay();
            }
        }

        // Reliable Image Loader from TMDB
        function loadTMDBPoster(posterPath) {
            const tmdbUrl = `https://image.tmdb.org/t/p/w500${posterPath}`;
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                filmPosterImg.src = tmdbUrl;
            };
            img.onerror = () => {
                // Fetch dynamic poster from TMDB API if explicit path fails
                fetch(`https://api.themoviedb.org/3/movie/${targetMovie.tmdbId}?api_key=${TMDB_API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.poster_path) {
                            filmPosterImg.src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                        }
                    })
                    .catch(() => {
                        filmPosterImg.alt = "Poster unavailable";
                    });
            };
            img.src = tmdbUrl;
        }

        function endGame(won) {
            isGameOver = true;
            document.getElementById('gameControls').style.display = 'none';

            // Unlock ALL clues so player can browse through them post-game
            unlockedClueIndex = hintsList.length - 1;
            updateClueDisplay();

            statusDisplay.classList.add('active');
            
            filmTitleText.textContent = targetMovie.title;
            filmDirectorText.textContent = `${targetMovie.year} \u2022 Dir. ${targetMovie.director}`;
            
           // Load TMDB Poster cleanly
loadTMDBPoster(targetMovie.posterPath);

if (won) {
    statusBadge.className = 'status-header-badge win';
    statusBadge.textContent = "ENTRY VERIFIED";

    solveStatsText.textContent =
        `Solved in ${attemptsUsed} ${attemptsUsed === 1 ? 'guess' : 'guesses'}!`;
} else {
    statusBadge.className = 'status-header-badge fail';
    statusBadge.textContent = "ENTRY UNRESOLVED";

    solveStatsText.textContent = "Out of guesses (5/5 used).";
}

// Load YouTube trailer
if (targetMovie.youtubeKey) {
    const videoId = String(targetMovie.youtubeKey).trim();

    // Basic YouTube video ID validation
    if (/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        mediaIframe.src =
            `https://www.youtube-nocookie.com/embed/${videoId}` +
            `?autoplay=1&playsinline=1&rel=0`;
    } else {
        console.error("Invalid YouTube video ID:", videoId);
        mediaIframe.removeAttribute('src');
    }
} else {
    console.warn("No YouTube trailer available for:", targetMovie);
    mediaIframe.removeAttribute('src');
}


window.addEventListener('DOMContentLoaded', () => {
    updateClueDisplay();

    prevClueBtn.addEventListener('click', () => {
        if (viewedClueIndex > 0) {
            viewedClueIndex--;
            updateClueDisplay();
        }
    });

    nextClueBtn.addEventListener('click', () => {
        if (viewedClueIndex < unlockedClueIndex) {
            viewedClueIndex++;
            updateClueDisplay();
        }
    });

    gameInput.addEventListener('input', () => {
        hideFeedback();
        handleInput();
    });

    skipBtn.addEventListener('click', handleSkip);

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-input-wrapper')) {
            dropdownList.classList.remove('active');
        }
    });
});
    </script>
</body>
</html>
