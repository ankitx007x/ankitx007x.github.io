<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher — Fragments & Echoes</title>

    <style>
        :root {
            --bg-color: #08080b;
            --text-primary: #e4e4ed;
            --text-secondary: #5a5a6e;
            --accent: #a385b9;
            --accent-dim: rgba(163, 133, 185, 0.15);
            --nav-bg: rgba(8, 8, 11, 0.9);
            --border: #161622;
            --card-bg: rgba(18, 18, 26, 0.4);
            --success: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 2.5rem;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
        }

        .nav-logo {
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
            text-decoration: none;
            opacity: 0.8;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-dim);
        }

        main {
            width: 100%;
            max-width: 680px;
            padding-top: 110px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .page-header {
            margin-bottom: 0.25rem;
        }

        .page-sublogo {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.95;
            display: inline-block;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            gap: 1rem;
        }

        .game-title {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .clue-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .clue-nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .clue-nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .clue-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .clue-counter {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-width: 110px;
            text-align: center;
        }

        .clue-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 4px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .clue-card:hover {
            border-color: rgba(163, 133, 185, 0.4);
        }

        .clue-type-badge {
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
        }

        .clue-text {
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #f0f0f5;
            text-align: center;
        }

        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .game-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-family: Georgia, serif;
            font-size: 1rem;
            font-style: italic;
            color: var(--text-primary);
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .game-input:focus {
            border-color: var(--accent);
        }

        .feedback-message {
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--error-red);
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: -0.25rem;
        }

        .feedback-message.visible {
            opacity: 1;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .dropdown-list.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background: var(--card-bg);
            outline: none;
        }

        .dropdown-item.status-msg {
            cursor: default;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            justify-content: center;
            padding: 1rem;
        }

        .dropdown-poster {
            width: 32px;
            height: 48px;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
            background-color: #161622;
            flex-shrink: 0;
        }

        .dropdown-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dropdown-title {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dropdown-meta {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-skip {
            align-self: flex-start;
            border: none;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 1px;
            cursor: pointer;
            background: transparent;
            transition: color 0.2s ease;
            margin-top: 0.25rem;
        }

        .btn-skip:hover {
            color: var(--accent);
        }

        .status-display {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 6px;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .status-display.active {
            display: flex;
        }

        .status-header-badge {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            display: inline-block;
        }

        .status-header-badge.win {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-header-badge.fail {
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--border);
        }

        .film-card-summary {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(8, 8, 11, 0.6);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 4px;
            width: 100%;
            text-align: left;
        }

        .film-poster-container {
            width: 85px;
            height: 128px;
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background-color: #12121a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .film-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .film-meta-details {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .film-title-text {
            font-size: 1.35rem;
            font-style: italic;
            color: var(--text-primary);
        }

        .film-subtext {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .solve-stats {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 0.2rem;
        }

        .media-frame-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .media-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(110, 110, 128, 0.3);
            letter-spacing: 1.5px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            nav {
                padding: 1.5rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1.2rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding-top: 155px;
            }

            .game-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .film-card-summary {
                flex-direction: column;
                text-align: center;
            }

            .film-meta-details {
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="/" class="nav-logo">// f&amp;e</a>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="quotes">Quotes</a></li>
            <li><a href="poems">Poems</a></li>
            <li><a href="cinema">Cinema</a></li>
            <li><a href="cipher" class="active">Cipher</a></li>
        </ul>
    </nav>

    <main>
        <div class="page-header">
            <span class="page-sublogo">// CIPHER</span>
        </div>

        <div class="game-header">
            <span class="game-title">Guess The Film</span>

            <div class="clue-nav-wrapper">
                <button
                    type="button"
                    class="clue-nav-btn"
                    id="prevClueBtn"
                    title="Previous Clue"
                    aria-label="Previous clue"
                >&lt;</button>

                <span class="clue-counter" id="clueCounter">HINT 1 / 5</span>

                <button
                    type="button"
                    class="clue-nav-btn"
                    id="nextClueBtn"
                    title="Next Unlocked Clue"
                    aria-label="Next clue"
                >&gt;</button>
            </div>
        </div>

        <div class="clue-card">
            <span class="clue-type-badge" id="clueTypeBadge">Initial Quote</span>
            <div class="clue-text" id="clueText">Loading quote...</div>
        </div>

        <div class="game-controls" id="gameControls">
            <div class="search-input-wrapper">
                <input
                    type="text"
                    id="gameInput"
                    class="game-input"
                    placeholder="Type film title to guess..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Film title guess"
                    aria-autocomplete="list"
                    aria-controls="dropdownList"
                >

                <div class="dropdown-list" id="dropdownList" role="listbox"></div>
            </div>

            <div
                class="feedback-message"
                id="feedbackMessage"
                role="status"
                aria-live="polite"
            ></div>

            <button type="button" class="btn-skip" id="skipBtn">
                SKIP &amp; UNLOCK HINT (+1 TRY)
            </button>
        </div>

        <div class="status-display" id="statusDisplay">
            <div class="status-header-badge" id="statusBadge">ENTRY VERIFIED</div>

            <div class="film-card-summary">
                <div class="film-poster-container">
                    <img
                        class="film-poster-img"
                        id="filmPosterImg"
                        src=""
                        alt="Film poster"
                        loading="lazy"
                    >
                </div>

                <div class="film-meta-details">
                    <div class="film-title-text" id="filmTitleText">Mulholland Drive</div>
                    <div class="film-subtext" id="filmDirectorText">
                        2001 • Dir. David Lynch
                    </div>
                    <div class="solve-stats" id="solveStatsText">
                        Solved on Guess 1 of 5
                    </div>
                </div>
            </div>

            <div class="media-frame-wrapper" id="mediaWrapper">
                <iframe
                    class="media-iframe"
                    id="mediaIframe"
                    title="Film trailer"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen
                    loading="lazy"
                ></iframe>
            </div>
        </div>
    </main>

    <footer>
        [ fragments &amp; echoes // daily cipher ]
    </footer>

    <script>
        "use strict";

        /*
         * NOTE:
         * The TMDB API key was present in the original client-side file.
         * Any key embedded in frontend JavaScript is visible to visitors.
         * Restrict the key in TMDB's dashboard or move API requests to a backend
         * if this site is public.
         */

        const TMDB_API_KEY = "a2423ea9535bda58e2447a6a29d92cb6";
        const MAX_ATTEMPTS = 5;

        const targetMovie = {
            tmdbId: 490,
            title: "Mulholland Drive",
            year: "2001",
            director: "David Lynch",
            leadActor: "Naomi Watts",
            keyActorMovie: "The Ring (2002) & King Kong (2005)",
            posterPath: "/oT182e0jvhZ6hNn9G4eE1E6gE2v.jpg",
            youtubeKey: "pv4S3iI7N6A"
        };

        const hintsList = [
            {
                type: "Quote",
                text: "\"I opened my eyes and I was completely lost. Nothing makes sense, but every single scene is hypnotizing.\""
            },
            {
                type: "Hint 1 (Key Actor Movie)",
                text: `Key actor starred in: ${targetMovie.keyActorMovie}`
            },
            {
                type: "Hint 2 (Lead Actor)",
                text: `Lead Actor: ${targetMovie.leadActor}`
            },
            {
                type: "Hint 3 (Release Year)",
                text: `Release Year: ${targetMovie.year}`
            },
            {
                type: "Hint 4 (Director)",
                text: `Director: ${targetMovie.director}`
            }
        ];

        let attemptsUsed = 0;
        let unlockedClueIndex = 0;
        let viewedClueIndex = 0;
        let debounceTimer = null;
        let searchRequestId = 0;
        let isGameOver = false;

        const clueCounter = document.getElementById("clueCounter");
        const clueTypeBadge = document.getElementById("clueTypeBadge");
        const clueText = document.getElementById("clueText");
        const prevClueBtn = document.getElementById("prevClueBtn");
        const nextClueBtn = document.getElementById("nextClueBtn");
        const gameInput = document.getElementById("gameInput");
        const dropdownList = document.getElementById("dropdownList");
        const feedbackMessage = document.getElementById("feedbackMessage");
        const skipBtn = document.getElementById("skipBtn");
        const gameControls = document.getElementById("gameControls");
        const statusDisplay = document.getElementById("statusDisplay");
        const statusBadge = document.getElementById("statusBadge");
        const filmPosterImg = document.getElementById("filmPosterImg");
        const filmTitleText = document.getElementById("filmTitleText");
        const filmDirectorText = document.getElementById("filmDirectorText");
        const solveStatsText = document.getElementById("solveStatsText");
        const mediaIframe = document.getElementById("mediaIframe");

        function updateClueDisplay() {
            const currentClue = hintsList[viewedClueIndex];

            if (!currentClue) {
                return;
            }

            clueCounter.textContent =
                `HINT ${viewedClueIndex + 1} / ${hintsList.length}`;

            clueTypeBadge.textContent = currentClue.type;
            clueText.textContent = currentClue.text;

            prevClueBtn.disabled = viewedClueIndex === 0;
            nextClueBtn.disabled =
                viewedClueIndex >= unlockedClueIndex;
        }

        async function fetchTMDBMovies(query, requestId) {
            if (!TMDB_API_KEY) {
                throw new Error("TMDB API key is missing.");
            }

            const params = new URLSearchParams({
                api_key: TMDB_API_KEY,
                query,
                include_adult: "false",
                language: "en-US"
            });

            const url =
                `https://api.themoviedb.org/3/search/movie?${params.toString()}`;

            const response = await fetch(url, {
                method: "GET",
                headers: {
                    Accept: "application/json"
                }
            });

            if (requestId !== searchRequestId) {
                return null;
            }

            if (!response.ok) {
                throw new Error(`TMDB request failed (${response.status}).`);
            }

            const data = await response.json();
            return Array.isArray(data.results) ? data.results : [];
        }

        function clearDropdown() {
            dropdownList.innerHTML = "";
            dropdownList.classList.remove("active");
        }

        function showDropdownMessage(message) {
            dropdownList.textContent = "";

            const messageElement = document.createElement("div");
            messageElement.className = "dropdown-item status-msg";
            messageElement.textContent = message;

            dropdownList.appendChild(messageElement);
            dropdownList.classList.add("active");
        }

        function createDropdownItem(movie) {
            const item = document.createElement("div");

            item.className = "dropdown-item";
            item.setAttribute("role", "option");
            item.tabIndex = 0;

            const poster = document.createElement("div");
            poster.className = "dropdown-poster";

            if (movie.poster_path) {
                poster.style.backgroundImage =
                    `url("https://image.tmdb.org/t/p/w92${movie.poster_path}")`;
            }

            const info = document.createElement("div");
            info.className = "dropdown-info";

            const title = document.createElement("span");
            title.className = "dropdown-title";
            title.textContent = movie.title || "Untitled";

            const meta = document.createElement("span");
            meta.className = "dropdown-meta";
            meta.textContent =
                movie.release_date
                    ? movie.release_date.substring(0, 4)
                    : "N/A";

            info.append(title, meta);
            item.append(poster, info);

            const selectMovie = () => {
                clearDropdown();
                submitGuess(movie.title || "");
            };

            item.addEventListener("click", selectMovie);

            item.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    selectMovie();
                }
            });

            return item;
        }

        function renderDropdown(movies) {
            dropdownList.replaceChildren();

            movies.slice(0, 5).forEach((movie) => {
                dropdownList.appendChild(createDropdownItem(movie));
            });

            dropdownList.classList.toggle("active", movies.length > 0);
        }

        function handleInput() {
            clearTimeout(debounceTimer);

            const query = gameInput.value.trim();
            const requestId = ++searchRequestId;

            hideFeedback();

            if (isGameOver || query.length < 2) {
                clearDropdown();
                return;
            }

            showDropdownMessage("Searching cinema database...");

            debounceTimer = setTimeout(async () => {
                try {
                    const movies = await fetchTMDBMovies(query, requestId);

                    if (movies === null || requestId !== searchRequestId) {
                        return;
                    }

                    if (movies.length === 0) {
                        showDropdownMessage("No matching films found.");
                        return;
                    }

                    renderDropdown(movies);
                } catch (error) {
                    if (requestId !== searchRequestId) {
                        return;
                    }

                    console.error("TMDB API error:", error);
                    showDropdownMessage(
                        "Could not reach the cinema database."
                    );
                }
            }, 300);
        }

        function normalizeStr(value) {
            return String(value)
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
        }

        function submitGuess(selectedTitle) {
            if (isGameOver || !selectedTitle) {
                return;
            }

            attemptsUsed++;
            clearDropdown();
            gameInput.value = "";

            const isCorrect =
                normalizeStr(selectedTitle) ===
                normalizeStr(targetMovie.title);

            if (isCorrect) {
                hideFeedback();
                endGame(true);
                return;
            }

            if (attemptsUsed >= MAX_ATTEMPTS) {
                endGame(false);
                return;
            }

            showFeedback(
                `"${selectedTitle}" is incorrect. ` +
                `Try ${attemptsUsed}/${MAX_ATTEMPTS} used.`
            );

            advanceClue();
        }

        function showFeedback(message) {
            feedbackMessage.textContent = message;
            feedbackMessage.classList.add("visible");
        }

        function hideFeedback() {
            feedbackMessage.textContent = "";
            feedbackMessage.classList.remove("visible");
        }

        function handleSkip() {
            if (isGameOver) {
                return;
            }

            attemptsUsed++;
            gameInput.value = "";
            clearDropdown();
            hideFeedback();

            if (attemptsUsed >= MAX_ATTEMPTS) {
                endGame(false);
                return;
            }

            advanceClue();
        }

        function advanceClue() {
            if (unlockedClueIndex >= hintsList.length - 1) {
                return;
            }

            unlockedClueIndex++;
            viewedClueIndex = unlockedClueIndex;
            updateClueDisplay();
        }

        function loadTMDBPoster() {
            const fallbackPath = targetMovie.posterPath;

            const setPoster = (posterPath) => {
                if (!posterPath) {
                    filmPosterImg.removeAttribute("src");
                    filmPosterImg.alt = "Poster unavailable";
                    return;
                }

                filmPosterImg.src =
                    `https://image.tmdb.org/t/p/w500${posterPath}`;
                filmPosterImg.alt = `${targetMovie.title} poster`;
            };

            if (fallbackPath) {
                setPoster(fallbackPath);
            }

            if (!TMDB_API_KEY || !targetMovie.tmdbId) {
                return;
            }

            const params = new URLSearchParams({
                api_key: TMDB_API_KEY,
                language: "en-US"
            });

            fetch(
                `https://api.themoviedb.org/3/movie/${targetMovie.tmdbId}?${params.toString()}`,
                {
                    headers: {
                        Accept: "application/json"
                    }
                }
            )
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`TMDB poster request failed (${response.status}).`);
                    }
                    return response.json();
                })
                .then((data) => {
                    if (data.poster_path) {
                        setPoster(data.poster_path);
                    }
                })
                .catch((error) => {
                    console.warn("Could not refresh poster from TMDB:", error);

                    if (!fallbackPath) {
                        filmPosterImg.removeAttribute("src");
                        filmPosterImg.alt = "Poster unavailable";
                    }
                });
        }

        function loadYouTubeTrailer() {
            const videoId = String(targetMovie.youtubeKey || "").trim();

            mediaIframe.removeAttribute("src");

            if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
                console.warn("Invalid YouTube video ID:", videoId);
                return;
            }

            const params = new URLSearchParams({
                autoplay: "1",
                playsinline: "1",
                rel: "0"
            });

            mediaIframe.src =
                `https://www.youtube-nocookie.com/embed/${videoId}?${params.toString()}`;
        }

        function endGame(won) {
            if (isGameOver) {
                return;
            }

            isGameOver = true;

            clearTimeout(debounceTimer);
            searchRequestId++;
            clearDropdown();
            gameControls.style.display = "none";

            // After the game ends, allow the player to browse all clues.
            unlockedClueIndex = hintsList.length - 1;
            viewedClueIndex = Math.max(
                0,
                Math.min(viewedClueIndex, unlockedClueIndex)
            );
            updateClueDisplay();

            statusDisplay.classList.add("active");

            filmTitleText.textContent = targetMovie.title;
            filmDirectorText.textContent =
                `${targetMovie.year} • Dir. ${targetMovie.director}`;

            loadTMDBPoster();

            if (won) {
                statusBadge.className = "status-header-badge win";
                statusBadge.textContent = "ENTRY VERIFIED";

                solveStatsText.textContent =
                    `Solved in ${attemptsUsed} ` +
                    `${attemptsUsed === 1 ? "guess" : "guesses"}!`;
            } else {
                statusBadge.className = "status-header-badge fail";
                statusBadge.textContent = "ENTRY UNRESOLVED";

                solveStatsText.textContent =
                    `Out of guesses (${attemptsUsed}/${MAX_ATTEMPTS} used).`;
            }

            loadYouTubeTrailer();
        }

        function initializeGame() {
            updateClueDisplay();

            prevClueBtn.addEventListener("click", () => {
                if (viewedClueIndex > 0) {
                    viewedClueIndex--;
                    updateClueDisplay();
                }
            });

            nextClueBtn.addEventListener("click", () => {
                if (viewedClueIndex < unlockedClueIndex) {
                    viewedClueIndex++;
                    updateClueDisplay();
                }
            });

            gameInput.addEventListener("input", handleInput);

            gameInput.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    clearDropdown();
                    return;
                }

                /*
                 * The actual guess should be selected from the TMDB dropdown.
                 * Enter therefore does not submit an arbitrary string.
                 */
                if (event.key === "Enter") {
                    event.preventDefault();

                    const firstItem =
                        dropdownList.querySelector(".dropdown-item:not(.status-msg)");

                    if (firstItem) {
                        firstItem.click();
                    }
                }
            });

            skipBtn.addEventListener("click", handleSkip);

            document.addEventListener("click", (event) => {
                if (!event.target.closest(".search-input-wrapper")) {
                    clearDropdown();
                }
            });

            // Don't leave an empty iframe consuming resources before game end.
            mediaIframe.removeAttribute("src");
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initializeGame);
        } else {
            initializeGame();
        }
    </script>
</body>
</html>
