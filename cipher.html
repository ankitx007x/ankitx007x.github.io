        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        header h1 {
            letter-spacing: 6px;
            font-size: 2.5rem;
            color: var(--accent-color);
            font-weight: 900;
        }

        .day-badge {
            display: inline-block;
            background: var(--border);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 5px;
            color: var(--text-muted);
        }

        .clues-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .clue-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        .clue-card.locked {
            opacity: 0.4;
            filter: blur(3px);
            user-select: none;
            pointer-events: none;
        }

        .clue-card .clue-num {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 6px;
            display: block;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        button.skip-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        button.skip-btn:hover {
            background: var(--border);
            color: var(--text-main);
        }

        .status-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .status-box.active {
            display: block;
        }

        .status-box.win {
            border-color: var(--success);
        }

        .status-box h2 {
            margin-bottom: 10px;
        }

        .btn-trailer {
            margin-top: 15px;
            background: var(--success);
            color: #fff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16/9;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>

</div>

// DAY LOGIC
const GAME_START_DAY = 1; 
let currentDay = GAME_START_DAY;
let currentMovie = MOVIE_STORE[(currentDay - 1) % MOVIE_STORE.length];
let unlockedClues = 1;
let gameOver = false;

// DOM Elements
const cluesContainer = document.getElementById('cluesContainer');
const guessInput = document.getElementById('guessInput');
const submitBtn = document.getElementById('submitBtn');
const skipBtn = document.getElementById('skipBtn');
const statusBox = document.getElementById('statusBox');
const statusTitle = document.getElementById('statusTitle');
const statusDesc = document.getElementById('statusDesc');
const trailerBtn = document.getElementById('trailerBtn');
const trailerModal = document.getElementById('trailerModal');
const youtubeIframe = document.getElementById('youtubeIframe');
const closeModal = document.getElementById('closeModal');
const dayDisplay = document.getElementById('dayDisplay');

function initGame() {
    dayDisplay.textContent = `DAY ${currentDay}`;
    renderClues();
    
    submitBtn.addEventListener('click', handleGuess);
    skipBtn.addEventListener('click', handleSkip);
    guessInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleGuess();
    });
    
    trailerBtn.addEventListener('click', () => {
        youtubeIframe.src = `https://www.youtube.com/embed/${currentMovie.youtubeKey}?autoplay=1`;
        trailerModal.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
        trailerModal.classList.remove('active');
        youtubeIframe.src = '';
    });
}

function renderClues() {
    cluesContainer.innerHTML = '';
    currentMovie.clues.forEach((clueText, index) => {
        const card = document.createElement('div');
        card.className = `clue-card ${index >= unlockedClues ? 'locked' : ''}`;
        card.innerHTML = `
            <span class="clue-num">Clue ${index + 1} of ${currentMovie.clues.length}</span>
            <div class="clue-text">${index < unlockedClues ? clueText : '••••••••••••••••••••••••••••••••••••'}</div>
        `;
        cluesContainer.appendChild(card);
    });
}

function normalizeTitle(str) {
    return str.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function handleGuess() {
    if (gameOver) return;
    const userGuess = normalizeTitle(guessInput.value);
    const targetTitle = normalizeTitle(currentMovie.title);

    if (!userGuess) return;

    if (userGuess === targetTitle) {
        endGame(true);
    } else {
        guessInput.value = '';
        guessInput.placeholder = "Incorrect! Try again or Skip...";
        if (unlockedClues < currentMovie.clues.length) {
            unlockedClues++;
            renderClues();
        } else {
            endGame(false);
        }
    }
}

function handleSkip() {
    if (gameOver) return;
    if (unlockedClues < currentMovie.clues.length) {
        unlockedClues++;
        renderClues();
        if (unlockedClues === currentMovie.clues.length) {
            skipBtn.textContent = "GIVE UP";
        }
    } else {
        endGame(false);
    }
}

function endGame(won) {
    gameOver = true;
    document.getElementById('controls').style.display = 'none';
    unlockedClues = currentMovie.clues.length;
    renderClues();

    statusBox.classList.add('active');
    if (won) {
        statusBox.classList.add('win');
        statusTitle.textContent = "CIPHER SOLVED!";
        statusDesc.textContent = `You correctly identified "${currentMovie.title}" (${currentMovie.year}) using ${unlockedClues} clues!`;
    } else {
        statusTitle.textContent = "CIPHER FAILED";
        statusDesc.textContent = `The movie was "${currentMovie.title}" (${currentMovie.year}). Better luck tomorrow!`;
    }

    if (currentMovie.youtubeKey) {
        trailerBtn.style.display = 'inline-block';
    }
}

initGame();
